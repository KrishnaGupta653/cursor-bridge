name: CI

on:
  push:
    branches:
      - main
      - dev
      - "feature/**"
      - "bugfix/**"
  pull_request:

permissions:
  contents: read

jobs:
  node-workspaces:
    name: Extension + PC Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install root workspace deps
        run: npm ci

      - name: Test extension security and CDP
        run: npm --workspace cursor-extension test

  extension-vsix:
    name: Extension VSIX
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install root workspace deps
        run: npm ci

      - name: Package VSIX
        working-directory: cursor-extension
        run: npx --yes @vscode/vsce@3 package --no-dependencies --allow-missing-repository --skip-license -o "$RUNNER_TEMP/cursor-remote-extension.vsix"

      - name: Upload VSIX
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cursor-remote-extension-vsix
          path: ${{ runner.temp }}/cursor-remote-extension.vsix
          if-no-files-found: error
          retention-days: 14

  relay-typecheck:
    name: Relay Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: relay-server/package-lock.json

      - name: Install relay deps
        working-directory: relay-server
        run: npm ci

      - name: Run type-check
        working-directory: relay-server
        run: npm run type-check

      - name: Test relay policy and authentication
        working-directory: relay-server
        run: npm test

      - name: Install isolated Redis test dependency
        run: sudo apt-get update && sudo apt-get install -y redis-server

      - name: Test relay Redis lifecycle
        working-directory: relay-server
        run: npm run test:redis

  mobile-analyze:
    name: Mobile Analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Flutter pub get
        working-directory: mobile-app
        run: flutter pub get

      - name: Flutter analyze (errors only)
        working-directory: mobile-app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Flutter tests
        working-directory: mobile-app
        run: flutter test

      - name: Flutter release web build
        working-directory: mobile-app
        run: flutter build web --release
