name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  node-workspaces:
    name: Extension + PC Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install root workspace deps
        run: npm ci

      - name: Test extension security and CDP
        run: npm --workspace cursor-extension test

      - name: Build pc-server
        run: npm --workspace pc-server run build

  relay-typecheck:
    name: Relay Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: relay-server/package-lock.json

      - name: Install relay deps
        working-directory: relay-server
        run: npm ci

      - name: Run type-check
        working-directory: relay-server
        run: npm run type-check

      - name: Test relay policy and authentication
        working-directory: relay-server
        run: npm test

      - name: Install isolated Redis test dependency
        run: sudo apt-get update && sudo apt-get install -y redis-server

      - name: Test relay Redis lifecycle
        working-directory: relay-server
        run: npm run test:redis

  mobile-analyze:
    name: Mobile Analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Flutter pub get
        working-directory: mobile-app
        run: flutter pub get

      - name: Flutter analyze (errors only)
        working-directory: mobile-app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Flutter tests
        working-directory: mobile-app
        run: flutter test

      - name: Flutter release web build
        working-directory: mobile-app
        run: flutter build web --release
