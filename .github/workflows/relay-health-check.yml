# 릴레이 서버 정기 점검: /api/health 호출 후 실패 시 열린 이슈 하나를 갱신 (없으면 생성)
# 작성: 2026-02-02

name: Relay server health check

permissions:
  contents: read
  issues: write

on:
  schedule:
    # 매일 09:00, 15:00, 21:00 KST (00:00, 06:00, 12:00 UTC)
    - cron: '0 0,6,12 * * *'
  workflow_dispatch:
    inputs:
      relay_base_url:
        description: 'Relay server base URL'
        required: false
        default: 'https://cursor-remote-rela.vercel.app'

env:
  RELAY_BASE_URL: ${{ github.event.inputs.relay_base_url || 'https://cursor-remote-rela.vercel.app' }}

jobs:
  check:
    name: Check relay health
    runs-on: ubuntu-latest
    steps:
      - name: Health check
        id: health
        run: |
          code=$(curl -s -o health.json -w "%{http_code}" --max-time 30 "$RELAY_BASE_URL/api/health" || echo "000")
          echo "http_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = "200" ] \
            && [ "$(jq -r '.success' health.json 2>/dev/null)" = "true" ] \
            && [ "$(jq -r '.data.status' health.json 2>/dev/null)" = "healthy" ]; then
            echo "failed=" >> "$GITHUB_OUTPUT"
          else
            echo "failed=yes" >> "$GITHUB_OUTPUT"
            echo "body<<EOF" >> "$GITHUB_OUTPUT"
            head -c 2000 health.json 2>/dev/null >> "$GITHUB_OUTPUT" || true
            echo "" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update issue
        if: steps.health.outputs.failed == 'yes'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          HTTP_CODE: ${{ steps.health.outputs.http_code }}
          HEALTH_BODY: ${{ steps.health.outputs.body }}
        with:
          script: |
            const prefix = '[Relay Health]';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `${process.env.RELAY_BASE_URL}/api/health failed at ${new Date().toISOString()}.`,
              '',
              `HTTP status: ${process.env.HTTP_CODE}`,
              '',
              '```json',
              process.env.HEALTH_BODY || '(empty)',
              '```',
              '',
              `Run: ${runUrl}`,
            ].join('\n');
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = open.find((i) => !i.pull_request && i.title.startsWith(prefix));
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `${prefix} Relay health check failing`,
                body: `${body}\n\n---\n*Opened by \`.github/workflows/relay-health-check.yml\`. Later failures are added as comments.*`,
              });
            }

      - name: Fail if health check failed
        if: steps.health.outputs.failed == 'yes'
        run: exit 1
