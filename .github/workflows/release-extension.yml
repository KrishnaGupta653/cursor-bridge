# Release the Cursor extension: push a tag like v0.7.0 (matching cursor-extension/package.json).
# Builds and tests the VSIX, attaches it to a GitHub Release with that version's CHANGELOG notes,
# and publishes to Open VSX when the repository secret OVSX_TOKEN is set (https://open-vsx.org).

name: Release extension

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    name: Build, release and publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Check the tag matches the extension version
        id: version
        run: |
          version="$(node -p "require('./cursor-extension/package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match cursor-extension/package.json version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install root workspace deps
        run: npm ci

      - name: Test extension
        run: npm --workspace cursor-extension test

      - name: Package VSIX
        working-directory: cursor-extension
        run: npx --yes @vscode/vsce@3 package --no-dependencies -o "$RUNNER_TEMP/cursor-remote-extension-${{ steps.version.outputs.version }}.vsix"

      - name: Release notes from CHANGELOG
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v v="## [$VERSION]" 'index($0, v) == 1 {on=1; next} on && /^## \[/ {exit} on {print}' \
            cursor-extension/CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          {
            echo
            echo "Install: download the .vsix below, then in Cursor run **Extensions: Install from VSIX…**, then **Cursor Remote: Set Up**."
            echo "Full guide: https://github.com/${GITHUB_REPOSITORY}/blob/main/SETUP.md"
          } >> "$RUNNER_TEMP/notes.md"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "$RUNNER_TEMP/cursor-remote-extension-${{ steps.version.outputs.version }}.vsix" \
            --title "Cursor Remote $GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --verify-tag

      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_TOKEN }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "OVSX_TOKEN is not set; skipping Open VSX."
            exit 0
          fi
          npx --yes ovsx@0 publish "$RUNNER_TEMP/cursor-remote-extension-${{ steps.version.outputs.version }}.vsix"
